
name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep Supabase Active
        run: |

          echo "Starting Supabase keep alive..."

          ACCESS_TOKEN=$(curl -s \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "email":"${{ secrets.DEMO_EMAIL }}",
              "password":"${{ secrets.DEMO_PASSWORD }}"
            }' | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Authentication failed"
            exit 1
          fi

          echo "Authenticated successfully"

          # products (public core table)
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN}"

          # profiles
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # cart
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cart?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # wishlist
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/wishlist?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # notifications
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/notifications?select=id&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # orders
          curl -s -o /dev/null \
            "${{ secrets.SUPABASE_URL }}/rest/v1/orders?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          echo "Supabase keep alive completed."

